name: One-time security migration scaffold

on:
  push:
    branches:
      - feature/ppm-frontend-foundation
    paths:
      - ".migration-scaffold/**"
      - ".github/workflows/one-time-migration-scaffold.yml"

permissions:
  contents: write

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Generate migration using Supabase CLI and commit staged SQL
        shell: bash
        run: |
          set -euo pipefail
          supabase migration new security_policy_hardening
          generated="$(find supabase/migrations -maxdepth 1 -type f -name '*_security_policy_hardening.sql' -print | sort | tail -n 1)"
          test -n "$generated"
          cp .migration-scaffold/security_policy_hardening.sql "$generated"
          rm .migration-scaffold/security_policy_hardening.sql
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$generated" .migration-scaffold
          git commit -m "fix(security): restrict project contract reads by role"
          git push origin "HEAD:${{ github.ref_name }}"
          echo "Generated migration: $generated"

      - name: Start isolated local Supabase stack
        run: supabase start

      - name: Replay all migrations including security hardening
        run: supabase db reset

      - name: Verify local migration history
        run: supabase migration list

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
